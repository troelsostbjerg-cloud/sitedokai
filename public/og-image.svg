<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI-tidslinjen">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0b12"/>
      <stop offset="1" stop-color="#10131f"/>
    </linearGradient>
    <radialGradient id="aurora" cx="50%" cy="0%" r="70%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#22d3ee" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0a0b12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#aurora)"/>

  <!-- logo -->
  <g transform="translate(90, 90)">
    <rect width="64" height="64" rx="16" fill="url(#grad)"/>
    <path d="M14 46 L28 28 L38 36 L52 18" fill="none" stroke="#0a0b12" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="52" cy="18" r="5.5" fill="#0a0b12"/>
    <text x="84" y="42" font-family="Outfit, sans-serif" font-size="30" font-weight="800" fill="#eef0f6">AI-tidslinjen</text>
  </g>

  <text x="90" y="320" font-family="Outfit, sans-serif" font-size="76" font-weight="800" fill="#eef0f6">Den mest revolutionerende</text>
  <text x="90" y="408" font-family="Outfit, sans-serif" font-size="76" font-weight="800" fill="url(#grad)">tidsalder — måned for måned</text>

  <text x="90" y="478" font-family="Outfit, sans-serif" font-size="30" font-weight="500" fill="#aeb4c2">Udviklingen i kunstig intelligens, fra januar 2025 til i dag.</text>

  <!-- mini tidslinje -->
  <g transform="translate(90, 540)">
    <line x1="0" y1="10" x2="1020" y2="10" stroke="#2a2f3e" stroke-width="2"/>
    <circle cx="0" cy="10" r="8" fill="#a78bfa"/>
    <circle cx="255" cy="10" r="8" fill="#22d3ee"/>
    <circle cx="510" cy="10" r="8" fill="#34d399"/>
    <circle cx="765" cy="10" r="8" fill="#fbbf24"/>
    <circle cx="1020" cy="10" r="9" fill="#67e8f9"/>
    <text x="0" y="46" font-family="JetBrains Mono, monospace" font-size="20" fill="#7a8092">2025</text>
    <text x="980" y="46" font-family="JetBrains Mono, monospace" font-size="20" fill="#7a8092">2026</text>
  </g>

  <text x="1110" y="120" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="22" fill="#7a8092">sitedokai.com</text>
</svg>
