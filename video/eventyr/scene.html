<script type="module">

import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';

// Setup
// ---------------------------------------------------------------------------
const params = new URLSearchParams(location.search);
const W = parseInt(params.get('w') || '1920', 10);
const H = parseInt(params.get('h') || '1080', 10);
const DURATION = 5;

const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

scene.fog = new THREE.Fog(0x2b2a6e, 22, 150);

const camera = new THREE.PerspectiveCamera(38, W / H, 0.05, 900);

// Deterministic randomness so every render is identical.
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const hash = (n) => rng(n * 9973 + 17)();

const clamp01 = (x) => Math.min(1, Math.max(0, x));
const smooth = (x) => { x = clamp01(x); return x * x * (3 - 2 * x); };
const smoother = (x) => { x = clamp01(x); return x * x * x * (x * (x * 6 - 15) + 10); };
const lerp = (a, b, t) => a + (b - a) * t;

// Hermite spline over time-stamped keys: [{t, v:[x,y,z]}]
function track(keys, t, out = new THREE.Vector3()) {
  if (t <= keys[0].t) return out.fromArray(keys[0].v);
  const n = keys.length;
  if (t >= keys[n - 1].t) return out.fromArray(keys[n - 1].v);
  let i = 0;
  while (t > keys[i + 1].t) i++;
  const k0 = keys[i], k1 = keys[i + 1];
  const h = k1.t - k0.t;
  const s = (t - k0.t) / h;
  const tan = (j) => {
    if (j === 0 || j === n - 1) return [0, 0, 0];
    const a = keys[j - 1], b = keys[j + 1];
    const dt = b.t - a.t;
    return [0, 1, 2].map((c) => (b.v[c] - a.v[c]) / dt);
  };
  const m0 = tan(i), m1 = tan(i + 1);
  const s2 = s * s, s3 = s2 * s;
  const h00 = 2 * s3 - 3 * s2 + 1, h10 = s3 - 2 * s2 + s, h01 = -2 * s3 + 3 * s2, h11 = s3 - s2;
  return out.set(
    h00 * k0.v[0] + h10 * h * m0[0] + h01 * k1.v[0] + h11 * h * m1[0],
    h00 * k0.v[1] + h10 * h * m0[1] + h01 * k1.v[1] + h11 * h * m1[1],
    h00 * k0.v[2] + h10 * h * m0[2] + h01 * k1.v[2] + h11 * h * m1[2],
  );
}

// ---------------------------------------------------------------------------
// Toon materials: stepped shading, soft moonlit rim, ink outlines
// ---------------------------------------------------------------------------
function makeGradient(steps) {
  const data = new Uint8Array(steps.length * 4);
  steps.forEach((v, i) => { data.set([v, v, v, 255], i * 4); });
  const tex = new THREE.DataTexture(data, steps.length, 1);
  tex.minFilter = tex.magFilter = THREE.NearestFilter;
  tex.needsUpdate = true;
  return tex;
}
const GRAD = makeGradient([70, 135, 200, 255]);
const RIM_COLOR = new THREE.Color(0x9fb8ff);

function toon(color, opts = {}) {
  const { rim = 0.35, ...rest } = opts;
  const m = new THREE.MeshToonMaterial({ color, gradientMap: GRAD, ...rest });
  m.onBeforeCompile = (shader) => {
    shader.uniforms.uRim = { value: rim };
    shader.uniforms.uRimColor = { value: RIM_COLOR };
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', '#include <common>\nuniform float uRim;\nuniform vec3 uRimColor;')
      .replace('#include <opaque_fragment>', `
        float facing = max(dot(normal, normalize(vViewPosition)), 0.0);
        float rimAmt = smoothstep(0.62, 0.7, 1.0 - facing);
        outgoingLight += uRimColor * rimAmt * uRim * (0.35 + 0.65 * diffuseColor.rgb);
        #include <opaque_fragment>`);
  };
  m.customProgramCacheKey = () => 'toonrim';
  return m;
}

const outlineCache = new Map();
function outlineMat(thickness, color = 0x1b1030) {
  const key = thickness + ':' + color;
  if (outlineCache.has(key)) return outlineCache.get(key);
  const m = new THREE.ShaderMaterial({
    uniforms: { uThick: { value: thickness }, uColor: { value: new THREE.Color(color) } },
    vertexShader: `
      uniform float uThick;
      void main() {
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        vec3 n = normalize(normalMatrix * normal);
        mv.xyz += n * uThick * (1.0 + 0.04 * -mv.z);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform vec3 uColor;
      void main() { gl_FragColor = vec4(uColor, 1.0); }`,
    side: THREE.BackSide,
  });
  outlineCache.set(key, m);
  return m;
}
function ink(mesh, thickness = 0.012, color) {
  const o = new THREE.Mesh(mesh.geometry, outlineMat(thickness, color));
  o.raycast = () => {};
  mesh.add(o);
  return mesh;
}

function mesh(geo, mat, { cast = true, receive = true, outline = 0 } = {}) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = cast;
  m.receiveShadow = receive;
  if (outline) ink(m, outline);
  return m;
}

// ---------------------------------------------------------------------------
// Canvas textures (painted on the fly)
// ---------------------------------------------------------------------------
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat); }
  return t;
}

function starPath(ctx, x, y, r, points = 5) {
  ctx.beginPath();
  for (let i = 0; i < points * 2; i++) {
    const a = (i / (points * 2)) * Math.PI * 2 - Math.PI / 2;
    const rr = i % 2 ? r * 0.45 : r;
    ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  ctx.closePath();
}

const wallpaperTex = canvasTex(512, 512, (ctx, w, h) => {
  ctx.fillStyle = '#6f9fb5'; ctx.fillRect(0, 0, w, h);
  for (let x = 0; x < w; x += 64) { ctx.fillStyle = '#679aae'; ctx.fillRect(x + 26, 0, 12, h); }
  const r = rng(3);
  for (let i = 0; i < 18; i++) {
    const x = (i % 6) * 85 + 30 + (Math.floor(i / 6) % 2) * 42, y = Math.floor(i / 6) * 170 + 60;
    if (i % 3 === 0) {
      ctx.fillStyle = '#f6e3a8';
      ctx.beginPath(); ctx.arc(x, y, 16, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#6f9fb5';
      ctx.beginPath(); ctx.arc(x + 8, y - 5, 14, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = '#f6e3a8'; starPath(ctx, x, y, 10 + r() * 4); ctx.fill();
    }
  }
});

const floorTex = canvasTex(1024, 1024, (ctx, w, h) => {
  const r = rng(11);
  const plank = 128;
  for (let x = 0; x < w; x += plank) {
    let y = -r() * 400;
    while (y < h) {
      const len = 300 + r() * 380;
      const shade = 0.85 + r() * 0.3;
      ctx.fillStyle = `rgb(${Math.round(176 * shade)},${Math.round(112 * shade)},${Math.round(70 * shade)})`;
      ctx.fillRect(x, y, plank, len);
      ctx.strokeStyle = 'rgba(90,45,25,0.18)'; ctx.lineWidth = 2;
      for (let g = 0; g < 5; g++) {
        ctx.beginPath(); const gx = x + 12 + r() * (plank - 24);
        ctx.moveTo(gx, y); ctx.bezierCurveTo(gx + 8, y + len * 0.3, gx - 8, y + len * 0.6, gx + 3, y + len); ctx.stroke();
      }
      ctx.fillStyle = '#4a2716'; ctx.fillRect(x, y, plank, 4);
      y += len;
    }
    ctx.fillStyle = '#4a2716'; ctx.fillRect(x, 0, 5, h);
  }
}, [2, 2]);

const quiltTex = canvasTex(512, 512, (ctx, w, h) => {
  const cols = ['#d9534f', '#f2c14e', '#4f9da6', '#f6ecd6', '#e07a5f', '#6a8d73'];
  const r = rng(5); const s = 64;
  for (let y = 0; y < h; y += s) for (let x = 0; x < w; x += s) {
    ctx.fillStyle = cols[Math.floor(r() * cols.length)]; ctx.fillRect(x, y, s, s);
    if (r() > 0.6) { ctx.fillStyle = 'rgba(255,255,255,0.35)'; starPath(ctx, x + s / 2, y + s / 2, 14); ctx.fill(); }
    ctx.strokeStyle = 'rgba(255,245,220,0.8)'; ctx.setLineDash([6, 5]); ctx.lineWidth = 3; ctx.strokeRect(x + 4, y + 4, s - 8, s - 8);
  }
});

const rugTex = canvasTex(512, 512, (ctx, w, h) => {
  const cols = ['#b5443b', '#e2a93b', '#3f7f8c', '#f1e2c2'];
  for (let i = 12; i > 0; i--) {
    ctx.fillStyle = cols[i % cols.length];
    ctx.beginPath(); ctx.arc(w / 2, h / 2, (i / 12) * (w / 2), 0, Math.PI * 2); ctx.fill();
  }
});

const pjTex = canvasTex(256, 256, (ctx, w, h) => {
  ctx.fillStyle = '#7fb2e5'; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#6aa0d8'; for (let x = 0; x < w; x += 32) ctx.fillRect(x, 0, 12, h);
  ctx.fillStyle = '#ffe07a';
  for (let i = 0; i < 8; i++) { starPath(ctx, (i % 4) * 64 + 20 + (i > 3 ? 32 : 0), i > 3 ? 180 : 60, 11); ctx.fill(); }
}, [3, 2]);

function letterTex(ch, bg, fg) {
  return canvasTex(256, 256, (ctx, w, h) => {
    ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = fg; ctx.lineWidth = 14; ctx.strokeRect(18, 18, w - 36, h - 36);
    ctx.fillStyle = fg; ctx.font = 'bold 170px Georgia, serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(ch, w / 2, h / 2 + 10);
  });
}

const moonTex = canvasTex(512, 512, (ctx, w, h) => {
  const g = ctx.createRadialGradient(w * 0.45, h * 0.42, 10, w / 2, h / 2, w / 2);
  g.addColorStop(0, '#fffbe6'); g.addColorStop(0.85, '#fbeec0'); g.addColorStop(1, '#f1d98f');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(w / 2, h / 2, w / 2 - 2, 0, Math.PI * 2); ctx.fill();
  const r = rng(21);
  for (let i = 0; i < 14; i++) {
    const a = r() * Math.PI * 2, d = r() * 0.36 * w, rr = 12 + r() * 38;
    ctx.fillStyle = `rgba(214,190,130,${0.25 + r() * 0.25})`;
    ctx.beginPath(); ctx.arc(w / 2 + Math.cos(a) * d, h / 2 + Math.sin(a) * d, rr, 0, Math.PI * 2); ctx.fill();
  }
});

const glowTex = canvasTex(256, 256, (ctx, w, h) => {
  const g = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.25, 'rgba(255,255,255,0.45)');
  g.addColorStop(0.6, 'rgba(255,255,255,0.1)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
});

// ---------------------------------------------------------------------------
// Lights
// ---------------------------------------------------------------------------
const hemi = new THREE.HemisphereLight(0x7d8fe0, 0x3a2a52, 1.35);
scene.add(hemi);
scene.add(new THREE.AmbientLight(0x4a4f9a, 0.35));

const moonLight = new THREE.DirectionalLight(0xbcd0ff, 2.6);
moonLight.position.set(-5, 11, -15);
moonLight.target.position.set(0.2, 0, 0.2);
moonLight.castShadow = true;
moonLight.shadow.mapSize.set(2048, 2048);
Object.assign(moonLight.shadow.camera, { left: -7, right: 7, top: 7, bottom: -7, near: 1, far: 40 });
moonLight.shadow.bias = -0.0006;
moonLight.shadow.normalBias = 0.02;
moonLight.shadow.radius = 3;
scene.add(moonLight, moonLight.target);

const lampLight = new THREE.PointLight(0xffa860, 2.2, 3.0, 1.8);
lampLight.position.set(-2.05, 1.02, -3.3);
scene.add(lampLight);

// ---------------------------------------------------------------------------
// The nursery
// ---------------------------------------------------------------------------
const room = new THREE.Group();
scene.add(room);
const ROOM = { x: 4, zBack: -4, zFront: 5, h: 3.1 };
const WIN = { x0: -0.9, x1: 0.9, y0: 1.0, y1: 2.8 };

wallpaperTex.wrapS = wallpaperTex.wrapT = THREE.RepeatWrapping;
const wallMat = toon(0xffffff, { map: wallpaperTex, rim: 0.12 });
const trimMat = toon(0xf3ead8, { rim: 0.2 });
const woodMat = toon(0x9a5b34, { rim: 0.2 });
const darkWoodMat = toon(0x6b3a22, { rim: 0.2 });

// floor
const floor = mesh(new THREE.PlaneGeometry(8, 9), toon(0xd8c8c0, { map: floorTex, rim: 0.05 }), { cast: false });
floor.rotation.x = -Math.PI / 2; floor.position.z = 0.5;
room.add(floor);

// ceiling (only needed to block moonlight)
const ceil = mesh(new THREE.PlaneGeometry(8, 9), toon(0x4d5f8f), { receive: false });
ceil.rotation.x = Math.PI / 2; ceil.position.set(0, ROOM.h, 0.5);
room.add(ceil);

// back wall with window hole, built from 4 slabs
const T = 0.18;
function wallBox(x0, x1, y0, y1, z, mat = wallMat) {
  const g = new THREE.BoxGeometry(x1 - x0, y1 - y0, T);
  const uv = g.attributes.uv;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * (x1 - x0) / 1.6, uv.getY(i) * (y1 - y0) / 1.6);
  const m = mesh(g, mat);
  m.position.set((x0 + x1) / 2, (y0 + y1) / 2, z);
  room.add(m);
  return m;
}
wallBox(-ROOM.x, WIN.x0, 0, ROOM.h, ROOM.zBack);
wallBox(WIN.x1, ROOM.x, 0, ROOM.h, ROOM.zBack);
wallBox(WIN.x0, WIN.x1, 0, WIN.y0, ROOM.zBack);
wallBox(WIN.x0, WIN.x1, WIN.y1, ROOM.h, ROOM.zBack);

// side walls
for (const s of [-1, 1]) {
  const g = new THREE.BoxGeometry(T, ROOM.h, 9);
  const uv = g.attributes.uv;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * 9 / 1.6, uv.getY(i) * ROOM.h / 1.6);
  const m = mesh(g, wallMat);
  m.position.set(s * ROOM.x, ROOM.h / 2, 0.5);
  room.add(m);
}

// wainscot + chair rail + skirting on visible walls
function panel(x0, x1, z, rotY = 0) {
  const g = new THREE.Group();
  const w = x1 - x0;
  g.add(Object.assign(mesh(new THREE.BoxGeometry(w, 0.95, 0.03), toon(0xe8dcc3, { rim: 0.15 })), {}));
  g.children[0].position.y = 0.475;
  const rail = mesh(new RoundedBoxGeometry(w, 0.07, 0.07, 2, 0.02), trimMat, { outline: 0.006 });
  rail.position.y = 0.96; g.add(rail);
  const skirt = mesh(new THREE.BoxGeometry(w, 0.16, 0.05), trimMat);
  skirt.position.y = 0.08; g.add(skirt);
  g.position.set((x0 + x1) / 2, 0, z); g.rotation.y = rotY;
  room.add(g);
}
panel(-ROOM.x, WIN.x0, ROOM.zBack + T / 2 + 0.015);
panel(WIN.x1, ROOM.x, ROOM.zBack + T / 2 + 0.015);
panel(WIN.x0, WIN.x1, ROOM.zBack + T / 2 + 0.015);
{
  const g = new THREE.Group(); room.add(g);
  const len = 9;
  for (const s of [-1, 1]) {
    const p = mesh(new THREE.BoxGeometry(0.03, 0.95, len), toon(0xe8dcc3, { rim: 0.15 }));
    p.position.set(s * (ROOM.x - T / 2 - 0.015), 0.475, 0.5); g.add(p);
    const rail = mesh(new RoundedBoxGeometry(0.07, 0.07, len, 2, 0.02), trimMat);
    rail.position.set(s * (ROOM.x - T / 2 - 0.03), 0.96, 0.5); g.add(rail);
  }
}

// window frame, sill, mullions
const frameMat = toon(0xf7f0e2, { rim: 0.25 });
function frameBar(w, h, d, x, y, z, parent = room) {
  const m = mesh(new RoundedBoxGeometry(w, h, d, 2, Math.min(w, h, d) * 0.3), frameMat, { outline: 0.008 });
  m.position.set(x, y, z); parent.add(m); return m;
}
frameBar(0.12, WIN.y1 - WIN.y0 + 0.24, 0.26, WIN.x0 - 0.02, (WIN.y0 + WIN.y1) / 2, ROOM.zBack + 0.02);
frameBar(0.12, WIN.y1 - WIN.y0 + 0.24, 0.26, WIN.x1 + 0.02, (WIN.y0 + WIN.y1) / 2, ROOM.zBack + 0.02);
frameBar(WIN.x1 - WIN.x0 + 0.3, 0.14, 0.26, 0, WIN.y1 + 0.03, ROOM.zBack + 0.02);
frameBar(WIN.x1 - WIN.x0 + 0.44, 0.08, 0.42, 0, WIN.y0 - 0.02, ROOM.zBack + 0.12); // sill

// casement panes, hinged at the sides, open outward
const glassMat = new THREE.MeshPhysicalMaterial({ color: 0xa8c4ff, transparent: true, opacity: 0.18, roughness: 0.05, metalness: 0, depthWrite: false });
const panes = [];
for (const s of [-1, 1]) {
  const hinge = new THREE.Group();
  hinge.position.set(s * WIN.x1, 0, ROOM.zBack - 0.05);
  room.add(hinge);
  const pw = WIN.x1 - 0.02, ph = WIN.y1 - WIN.y0 - 0.04;
  const pane = new THREE.Group();
  pane.position.set(-s * pw / 2, (WIN.y0 + WIN.y1) / 2, 0);
  hinge.add(pane);
  const bar = (w, h, x, y) => { const m = mesh(new RoundedBoxGeometry(w, h, 0.05, 1, 0.012), frameMat, { outline: 0.005 }); m.position.set(x, y, 0); pane.add(m); };
  bar(0.06, ph, -pw / 2 + 0.03, 0); bar(0.06, ph, pw / 2 - 0.03, 0);
  bar(pw, 0.06, 0, ph / 2 - 0.03); bar(pw, 0.06, 0, -ph / 2 + 0.03);
  bar(0.035, ph, 0, 0); bar(pw, 0.035, 0, ph / 6); bar(pw, 0.035, 0, -ph / 6);
  const glass = new THREE.Mesh(new THREE.PlaneGeometry(pw - 0.05, ph - 0.05), glassMat);
  glass.castShadow = false; pane.add(glass);
  panes.push({ hinge, s });
}

// curtains that breathe in the night wind
const curtainMat = toon(0xe2c0a6, { side: THREE.DoubleSide, rim: 0.3 });
const curtains = [];
for (const s of [-1, 1]) {
  const geo = new THREE.PlaneGeometry(0.72, 2.35, 18, 26);
  const base = geo.attributes.position.array.slice();
  const m = mesh(geo, curtainMat);
  m.position.set(s * 1.12, 1.78, ROOM.zBack + 0.3);
  room.add(m);
  curtains.push({ m, geo, base, s });
}
// curtain rod
{
  const rod = mesh(new THREE.CylinderGeometry(0.025, 0.025, 3.0, 12), toon(0xc28f3c, { rim: 0.4 }), { outline: 0.005 });
  rod.rotation.z = Math.PI / 2; rod.position.set(0, 2.98, ROOM.zBack + 0.3); room.add(rod);
  for (const s of [-1, 1]) {
    const k = mesh(new THREE.SphereGeometry(0.06, 16, 12), toon(0xc28f3c, { rim: 0.4 }), { outline: 0.005 });
    k.position.set(s * 1.52, 2.98, ROOM.zBack + 0.3); room.add(k);
  }
}

// rug
{
  const rug = mesh(new THREE.CylinderGeometry(1.35, 1.35, 0.02, 64), toon(0xffffff, { map: rugTex, rim: 0.1 }), { cast: false });
  rug.position.set(0.1, 0.01, 0.6); rug.scale.z = 0.8; room.add(rug);
}

// bed on the left
{
  const bed = new THREE.Group(); bed.position.set(-2.95, 0, -0.6); room.add(bed);
  const post = (x, z, h) => { const p = mesh(new THREE.CylinderGeometry(0.06, 0.07, h, 14), woodMat, { outline: 0.008 }); p.position.set(x, h / 2, z); bed.add(p);
    const k = mesh(new THREE.SphereGeometry(0.085, 16, 12), woodMat, { outline: 0.008 }); k.position.set(x, h + 0.04, z); bed.add(k); };
  post(-0.55, -1.2, 1.35); post(0.55, -1.2, 1.35); post(-0.55, 1.05, 0.85); post(0.55, 1.05, 0.85);
  const head = mesh(new RoundedBoxGeometry(1.1, 0.75, 0.06, 3, 0.03), woodMat, { outline: 0.008 }); head.position.set(0, 0.95, -1.2); bed.add(head);
  const foot = mesh(new RoundedBoxGeometry(1.1, 0.4, 0.06, 3, 0.03), woodMat, { outline: 0.008 }); foot.position.set(0, 0.6, 1.05); bed.add(foot);

// sparkle point material (stars, pixie dust)
function sparkleMaterial({ spikes = 0.7 } = {}) {
  return new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
    uniforms: { uScale: { value: H / 2 }, uSpikes: { value: spikes } },
    vertexShader: `
      attribute float aSize; attribute float aAlpha; attribute vec3 aColor; attribute float aRot;
      varying float vAlpha; varying vec3 vColor; varying float vRot;
      uniform float uScale;
      void main(){
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = clamp(aSize * uScale / max(-mv.z, 0.05), 0.0, 256.0);
        vAlpha = aAlpha; vColor = aColor; vRot = aRot;
      }`,
    fragmentShader: `
      varying float vAlpha; varying vec3 vColor; varying float vRot;
      uniform float uSpikes;
      void main(){
        vec2 uv = gl_PointCoord * 2.0 - 1.0;
        float c = cos(vRot), s = sin(vRot);
        uv = mat2(c, -s, s, c) * uv;
        float r2 = dot(uv, uv);
        float core = exp(-r2 * 22.0);
        float glow = exp(-r2 * 5.0) * 0.25;
        float sp = exp(-abs(uv.x) * 18.0) * exp(-abs(uv.y) * 2.2) + exp(-abs(uv.y) * 18.0) * exp(-abs(uv.x) * 2.2);
        float a = (core + glow + sp * uSpikes) * vAlpha;
        if (a < 0.003) discard;
        gl_FragColor = vec4(vColor * a, a);
      }`,
  });
}
function makePoints(n, mat) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
  g.setAttribute('aSize', new THREE.BufferAttribute(new Float32Array(n), 1));
  g.setAttribute('aAlpha', new THREE.BufferAttribute(new Float32Array(n), 1));
  g.setAttribute('aColor', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
  g.setAttribute('aRot', new THREE.BufferAttribute(new Float32Array(n), 1));
  const p = new THREE.Points(g, mat);
  p.frustumCulled = false;
  return p;
}

const KID_BASE = new THREE.Vector3(0.05, 0, 0.55);
const LIFT_T0 = 1.2, LIFT_T1 = 2.55;
const kidFlight = [
  { t: LIFT_T1, v: [0.05, 1.25, 0.35] },
  { t: 3.05, v: [0.08, 1.45, -1.35] },
  { t: 3.55, v: [0.02, 1.6, -3.6] },
  { t: 3.9, v: [-0.2, 1.9, -5.6] },
  { t: 4.4, v: [-0.9, 2.6, -12.2] },
  { t: 5.0, v: [-2.9, 3.7, -15.6] },
];
function kidPos(t, out = new THREE.Vector3()) {
  if (t < LIFT_T0) return out.copy(KID_BASE);
  if (t < LIFT_T1) {
    const u = smoother((t - LIFT_T0) / (LIFT_T1 - LIFT_T0));
    return out.set(lerp(KID_BASE.x, 0.05, u), u * 1.25, lerp(KID_BASE.z, 0.35, u));
  }
  return track(kidFlight, t, out);
}

const fairyKeys = [
  { t: 0.0, v: [-1.6, 3.1, -9.5] },
  { t: 0.3, v: [-0.5, 2.4, -5.6] },
  { t: 0.55, v: [0.15, 2.05, -3.2] },
  { t: 0.85, v: [0.95, 1.6, -0.9] },
  { t: 1.1, v: [0.85, 1.2, 1.15] },
  { t: 1.35, v: [-0.55, 1.0, 1.15] },
  { t: 1.6, v: [-0.65, 1.35, 0.05] },
  { t: 1.85, v: [0.35, 1.8, -0.25] },
  { t: 2.1, v: [0.9, 2.05, -0.05] },
  { t: 2.35, v: [-0.55, 2.45, 0.25] },
  { t: 2.65, v: [-0.35, 2.35, -0.6] },
  { t: 3.0, v: [0.1, 2.2, -2.3] },
  { t: 3.35, v: [0.2, 2.15, -4.3] },
  { t: 3.8, v: [-0.9, 2.8, -7.8] },
  { t: 4.35, v: [-1.6, 3.1, -13.2] },
  { t: 5.0, v: [-4.3, 4.6, -17.5] },
];
function fairyPos(t, out = new THREE.Vector3()) {
  track(fairyKeys, t, out);
  out.x += Math.sin(t * 11.0) * 0.05;
  out.y += Math.sin(t * 13.0 + 1.0) * 0.05;
  out.z += Math.cos(t * 9.0) * 0.04;
  return out;
}

const tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3(), tmpC = new THREE.Vector3();

function updateKid(t) {
  const p = kidPos(t, new THREE.Vector3());
  kid.position.copy(p);

  // facing / body pitch
  let yaw, pitch = 0, roll = 0;
  const faceCam = 0.55;
  if (t < LIFT_T0) {
    yaw = faceCam;
  } else if (t < LIFT_T1) {
    const u = smooth((t - LIFT_T0 - 0.2) / (LIFT_T1 - LIFT_T0 - 0.1));
    yaw = lerp(faceCam, Math.PI, u);
    roll = Math.sin(u * Math.PI) * 0.15;
  } else {
    const v = kidPos(Math.min(t + 0.05, 5.2), tmpA).sub(kidPos(t, tmpB));
    const velYaw = Math.atan2(v.x, v.z);
    const u = smooth((t - LIFT_T1) / 0.45);
    yaw = lerp(Math.PI, velYaw < 0 ? velYaw + Math.PI * 2 : velYaw, u);
    pitch = lerp(0, 1.3, smooth((t - LIFT_T1) / 0.4));
    roll = Math.sin(t * 3.2) * 0.12 * u;
  }
  kid.rotation.set(0, yaw, 0);
  body.rotation.set(pitch, 0, roll);

  // breathing / bounce
  const standing = t < LIFT_T0;
  const squat = standing ? Math.max(0, Math.sin(clamp01((t - 0.85) / 0.35) * Math.PI)) * 0.04 : 0;
  body.position.y = 0.335 - squat + Math.sin(t * 5) * 0.005;
  body.scale.set(1 + squat * 0.6, 1 - squat * 0.8, 1 + squat * 0.6);

  // limbs
  const lift = smooth((t - LIFT_T0) / 0.6);
  const fly = smooth((t - LIFT_T1) / 0.5);
  // arms: at sides -> spread in delight -> superman
  armL.pivot.rotation.set(
    lerp(lerp(0.15, -0.3, lift), -2.9, fly) + Math.sin(t * 7) * 0.05 * (1 - fly),
    0,
    lerp(lerp(-0.25, -1.9, lift), -0.25, fly) + Math.sin(t * 6) * 0.1 * lift * (1 - fly),
  );
  armR.pivot.rotation.set(
    lerp(lerp(0.1, -0.2, lift), 0.35, fly),
    0,
    lerp(lerp(0.25, 1.75, lift), 0.35, fly) - Math.sin(t * 6 + 1) * 0.1 * lift * (1 - fly),
  );
  // legs dangle and kick
  const dangle = lift * (1 - fly);
  legL.pivot.rotation.set(lerp(0, 0.5, dangle) + Math.sin(t * 8) * 0.25 * dangle + fly * 0.25, 0, -0.04);
  legR.pivot.rotation.set(lerp(0, -0.2, dangle) - Math.sin(t * 8) * 0.25 * dangle + fly * (0.55 + Math.sin(t * 9) * 0.15), 0, 0.04);

  // head tracks the fairy until flight
  const f = fairyPos(t, tmpC);
  head.updateWorldMatrix(true, false);
  const hp = head.getWorldPosition(tmpA).add(tmpB.set(0, 0.18, 0));
  const dir = f.clone().sub(hp);
  const invYaw = -(yaw);
  const lx = dir.x * Math.cos(invYaw) + dir.z * Math.sin(invYaw);
  const lz = -dir.x * Math.sin(invYaw) + dir.z * Math.cos(invYaw);
  let hy = Math.atan2(lx, lz), hx = -Math.atan2(dir.y, Math.hypot(lx, lz));
  const track01 = 1 - fly;
  hy = THREE.MathUtils.clamp(hy, -1.0, 1.0) * track01;
  hx = THREE.MathUtils.clamp(hx, -0.6, 0.35) * track01 - fly * 0.95;
  head.rotation.set(hx, hy, 0);

  // eyes: blink once, pupils follow a bit
  const blink = Math.max(0, 1 - Math.abs(t - 0.62) / 0.07);
  for (const e of eyes) {
    e.lid.rotation.x = lerp(-0.9, 0.45, blink) - lift * 0.25;
    e.brow.position.y = 0.078 + lift * 0.015 + squat * 0.1;
  }
  mouth.scale.y = 0.8 + lift * 0.35;

  // nightcap flop
  const flutter = Math.sin(t * 14) * 0.08 * fly;
  capSegs.forEach((s, i) => {
    s.rotation.x = -(0.12 + i * 0.07) * (1 - fly) - fly * (0.34 + i * 0.05) + Math.sin(t * 4 + i) * 0.07 + flutter * (i + 1) * 0.4;
    s.rotation.z = Math.sin(t * 3 + i * 0.7) * 0.05 * (1 + fly);
  });
}

function updateFairy(t) {
  const p = fairyPos(t, fairy.position);
  fairy.lookAt(camera.position);
  const flap = Math.sin(t * 90);
  wings.forEach(({ piv, s }) => { piv.rotation.y = s * flap * 0.9; });
  const pulse = 1 + Math.sin(t * 17) * 0.12;
  // keep the fairy readable on screen as she races away from the camera
  const dist = p.distanceTo(camera.position);
  fairyGlow.scale.setScalar(0.4 * pulse * THREE.MathUtils.clamp(dist / 2.5, 1, 3.5));
  fairyLight.intensity = 0.9 * pulse;
}

const dustPos = dust.geometry.attributes.position.array;
const dustSize = dust.geometry.attributes.aSize.array;
const dustAlpha = dust.geometry.attributes.aAlpha.array;
const dustCol = dust.geometry.attributes.aColor.array;
const dustRot = dust.geometry.attributes.aRot.array;
function updateDust(t) {
  let n = 0;
  const DT = 1 / 240;
  const put = (x, y, z, size, alpha, r, g, b, rot) => {
    if (n >= DUST_N || alpha <= 0.003) return;
    dustPos[n * 3] = x; dustPos[n * 3 + 1] = y; dustPos[n * 3 + 2] = z;
    dustSize[n] = size; dustAlpha[n] = alpha; dustRot[n] = rot;
    dustCol[n * 3] = r; dustCol[n * 3 + 1] = g; dustCol[n * 3 + 2] = b;
    n++;
  };
  // fairy trail: particles born along the path, drifting and falling
  const LIFE = 1.1;
  const now = Math.floor(t / DT);
  for (let b = now; b > now - LIFE / DT && n < 900; b -= 1) {
    const bt = b * DT;
    if (bt < 0) break;
    const age = t - bt;
    const r = rng(b * 31 + 7);
    if (r() > 0.5) continue;
    const o = fairyPos(bt, tmpA);
    const vx = (r() - 0.5) * 0.5, vy = (r() - 0.5) * 0.3, vz = (r() - 0.5) * 0.5;
    const life = LIFE * (0.5 + r() * 0.5);
    const k = age / life;
    if (k >= 1) continue;
    const tw = 0.6 + 0.4 * Math.sin(t * 30 + b);
    const warm = r();
    put(o.x + vx * age, o.y + vy * age - 0.35 * age * age, o.z + vz * age,
      (0.035 + r() * 0.07) * (1 - k * 0.7), (1 - k) * (1 - k) * tw * 1.4,
      1.6, 1.25 + warm * 0.3, 0.55 + warm * 0.5, r() * 3);
  }
  // pixie dust showering the kid, then a trail behind them
  const kidDustStart = 1.05;
  if (t > kidDustStart) {
    const DT2 = 1 / 160;
    const now2 = Math.floor(t / DT2);
    for (let b = now2; b > now2 - 1.3 / DT2 && n < DUST_N; b -= 1) {
      const bt = b * DT2;
      if (bt < kidDustStart) break;
      const age = t - bt;
      const r = rng(b * 57 + 3);
      const kp = kidPos(bt, tmpB);
      const life = 0.8 + r() * 0.6;
      const k = age / life;
      if (k >= 1) continue;
      const a = r() * Math.PI * 2, rad = 0.18 + r() * 0.3;
      const hgt = r() * 1.1;
      const fall = bt < LIFT_T1 + 0.2 ? 0.25 : 0.12;
      const tw = 0.5 + 0.5 * Math.sin(t * 25 + b * 1.7);
      put(kp.x + Math.cos(a) * rad * (1 + age * 0.4), kp.y + 0.05 + hgt - fall * age, kp.z + Math.sin(a) * rad * (1 + age * 0.4),
        (0.03 + r() * 0.06) * (1 - k * 0.6), (1 - k) * tw * 1.1,
        1.5, 1.2, 0.6 + r() * 0.4, r() * 3);
    }
  }
  for (let i = n; i < DUST_N; i++) dustAlpha[i] = 0;
  dust.geometry.attributes.position.needsUpdate = true;
  dust.geometry.attributes.aSize.needsUpdate = true;
  dust.geometry.attributes.aAlpha.needsUpdate = true;
  dust.geometry.attributes.aColor.needsUpdate = true;
  dust.geometry.attributes.aRot.needsUpdate = true;
}

function updateWorld(t) {
  // curtains breathe; a gust when the fairy arrives and when the kid leaves
  const gust = 0.35 + 0.65 * Math.exp(-Math.pow((t - 0.55) / 0.35, 2)) + 0.8 * Math.exp(-Math.pow((t - 3.6) / 0.4, 2));
  for (const c of curtains) {
    const pos = c.geo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const bx = c.base[i * 3], by = c.base[i * 3 + 1];
      const down = clamp01((1.175 - by) / 2.35); // 0 at the rod, 1 at the hem
      const pleat = Math.sin(bx * 26 + 0.5) * 0.045 * (1 - down * 0.3);
      const inner = c.s < 0 ? clamp01((bx + 0.36) / 0.72) : clamp01((0.36 - bx) / 0.72);
      const billow = gust * down * down * (0.35 + 0.25 * Math.sin(t * 2.1 + by * 2 + c.s)) * (0.4 + inner * 0.6);
      pos.setXYZ(i, bx - c.s * billow * 0.25 * inner, by + billow * 0.08, pleat + billow);
    }
    pos.needsUpdate = true;
    c.geo.computeVertexNormals();
  }
  for (const { hinge, s } of panes) hinge.rotation.y = -s * (1.15 + Math.sin(t * 1.3 + s) * 0.04 + gust * 0.05);

  // stars twinkle
  const sa = stars.geometry.attributes.aAlpha.array, ss = stars.geometry.attributes.aSize.array;
  for (let i = 0; i < STAR_N; i++) sa[i] = 0.55 + 0.45 * Math.sin(t * (2 + hash(i) * 5) + hash(i + 999) * 6.28);
  stars.geometry.attributes.aAlpha.needsUpdate = true;

  // the second star swells as the kid heads for it
  const g = bigStar.geometry.attributes;
  const swell = smooth((t - 3.8) / 1.0);
  g.aSize.array[0] = 22 + swell * 26 + Math.sin(t * 9) * 3;
  g.aSize.array[1] = 16 + Math.sin(t * 6) * 2;
  g.aAlpha.array[0] = 0.9 + swell * 0.5; g.aAlpha.array[1] = 0.7;
  g.aRot.array[0] = t * 0.4;
  g.aSize.needsUpdate = g.aAlpha.needsUpdate = g.aRot.needsUpdate = true;

  clouds.forEach(({ g, x }, i) => { g.position.x = x + t * (0.25 + i * 0.05); });
}

// ---------------------------------------------------------------------------
const rt = new THREE.WebGLRenderTarget(W, H, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
composer.setPixelRatio(1);
composer.setSize(W, H);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 0.7, 0.5, 1.0);
composer.addPass(bloom);
const grade = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uAspect: { value: W / H }, uFade: { value: 1 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uTime; uniform float uAspect; uniform float uFade;
    varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main(){
      vec2 d = vUv - 0.5; d.x *= uAspect;
      float r = length(d);
      // subtle chromatic fringe toward the edges
      vec2 off = (vUv - 0.5) * 0.0025 * r;
      vec3 c;
      c.r = texture2D(tDiffuse, vUv + off).r;
      c.g = texture2D(tDiffuse, vUv).g;
      c.b = texture2D(tDiffuse, vUv - off).b;
      float lum = dot(c, vec3(0.2126, 0.7152, 0.0722));
      // cool shadows, warm highlights
      c = mix(c, c * vec3(0.9, 0.95, 1.15) + vec3(0.004, 0.0, 0.018), 1.0 - smoothstep(0.0, 0.35, lum));
      c = mix(c, c * vec3(1.06, 1.0, 0.92), smoothstep(0.45, 1.2, lum));
      c *= mix(1.0, 0.55, smoothstep(0.45, 1.05, r));
      float g = h(vUv * vec2(1920.0, 1080.0) + fract(uTime * 7.13) * 100.0) - 0.5;
      c += g * 0.018 * (0.4 + lum);
      c *= uFade;
      gl_FragColor = vec4(max(c, 0.0), 1.0);
    }`,
});
composer.addPass(grade);
composer.addPass(new OutputPass());

// ---------------------------------------------------------------------------
// Frame driver
// ---------------------------------------------------------------------------
function renderAt(t) {
  track(camKeys, t, camera.position);
  track(tgtKeys, t, tmpC);
  // tiny handheld drift, fading out as we leave the room
  const drift = 1 - smooth((t - 3.2) / 0.8);
  camera.position.x += Math.sin(t * 1.7) * 0.012 * drift;
  camera.position.y += Math.sin(t * 2.3 + 1) * 0.01 * drift;
  camera.lookAt(tmpC);
  camera.updateMatrixWorld();

  updateWorld(t);
  updateKid(t);
  updateFairy(t);
  updateDust(t);

  moon.lookAt(camera.position);
  grade.uniforms.uTime.value = t;
  grade.uniforms.uFade.value = smooth(t / 0.35);
  composer.render();
}

window.renderAt = (t) => { renderAt(t); return true; };
window.DURATION = DURATION;
window.READY = true;

if (!params.has('capture')) {
  const start = performance.now();
  const loop = () => {
    const t = ((performance.now() - start) / 1000) % DURATION;
    renderAt(parseFloat(params.get('t') ?? t));
    requestAnimationFrame(loop);
  };
  loop();
}
</script>
</body>
