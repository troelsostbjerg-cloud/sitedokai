<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">SiteDokAI wide agentic search card</title>
  <desc id="desc">Wide social graphic about Google Search and AI agents.</desc>
  <defs>
    <radialGradient id="glow-a" cx="78%" cy="14%" r="46%">
      <stop offset="0%" stop-color="#8fa68f" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#8fa68f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-b" cx="10%" cy="92%" r="38%">
      <stop offset="0%" stop-color="#dfe8dc" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#dfe8dc" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="76" height="76" patternUnits="userSpaceOnUse">
      <path d="M 76 0 L 0 0 0 76" fill="none" stroke="#fffdf8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="panel-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#151a17"/>
  <rect width="1200" height="630" fill="url(#glow-a)"/>
  <rect width="1200" height="630" fill="url(#glow-b)"/>
  <rect x="34" y="34" width="1132" height="562" rx="30" fill="url(#grid)" opacity="0.8"/>
  <rect x="34.5" y="34.5" width="1131" height="561" rx="30" fill="none" stroke="#fffdf8" stroke-opacity="0.14"/>

  <circle cx="76" cy="82" r="7" fill="#dfe8dc"/>
  <circle cx="76" cy="82" r="15" fill="none" stroke="#dfe8dc" stroke-opacity="0.16" stroke-width="8"/>
  <text x="98" y="93" fill="#fffdf8" font-family="Avenir Next, Avenir, Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">SiteDokAI</text>

  <text x="62" y="216" fill="#fffdf8" font-family="Georgia, Times New Roman, serif" font-size="74" font-weight="500" letter-spacing="-2.2">
    <tspan x="62" dy="0">Agentic search</tspan>
    <tspan x="62" dy="76">er ikke kun fremtid.</tspan>
  </text>
  <text x="62" y="395" fill="#fffdf8" fill-opacity="0.66" font-family="Avenir Next, Avenir, Arial, sans-serif" font-size="24">
    <tspan x="62" dy="0">Google gør Search mere handlingsorienteret.</tspan>
    <tspan x="62" dy="33">Nu skal virksomheden forstås af både mennesker og AI-agenter.</tspan>
  </text>

  <g filter="url(#panel-shadow)">
    <rect x="756" y="88" width="382" height="360" rx="26" fill="#202622" fill-opacity="0.94" stroke="#fffdf8" stroke-opacity="0.15"/>
    <text x="780" y="130" fill="#fffdf8" fill-opacity="0.45" font-family="JetBrains Mono, Menlo, monospace" font-size="12" letter-spacing="2.2">AGENT VISIBILITY</text>
    <text x="780" y="188" fill="#fffdf8" fill-opacity="0.72" font-family="Avenir Next, Avenir, Arial, sans-serif" font-size="17">Findbarhed</text>
    <text x="1080" y="188" fill="#fffdf8" fill-opacity="0.72" font-family="Avenir Next, Avenir, Arial, sans-serif" font-size="17" text-anchor="end">72</text>
    <rect x="780" y="204" width="314" height="10" rx="5" fill="#fffdf8" fill-opacity="0.09"/>
    <rect x="780" y="204" width="226" height="10" rx="5" fill="#dfe8dc"/>

    <text x="780" y="266" fill="#fffdf8" fill-opacity="0.72" font-family="Avenir Next, Avenir, Arial, sans-serif" font-size="17">Kilder</text>
    <text x="1080" y="266" fill="#fffdf8" fill-opacity="0.72" font-family="Avenir Next, Avenir, Arial, sans-serif" font-size="17" text-anchor="end">58</text>
    <rect x="780" y="282" width="314" height="10" rx="5" fill="#fffdf8" fill-opacity="0.09"/>
    <rect x="780" y="282" width="182" height="10" rx="5" fill="#dfe8dc"/>

    <text x="780" y="344" fill="#fffdf8" fill-opacity="0.72" font-family="Avenir Next, Avenir, Arial, sans-serif" font-size="17">Shortlist</text>
    <text x="1080" y="344" fill="#fffdf8" fill-opacity="0.72" font-family="Avenir Next, Avenir, Arial, sans-serif" font-size="17" text-anchor="end">41</text>
    <rect x="780" y="360" width="314" height="10" rx="5" fill="#fffdf8" fill-opacity="0.09"/>
    <rect x="780" y="360" width="129" height="10" rx="5" fill="#dfe8dc" opacity="0.55"/>
  </g>

  <rect x="62" y="522" width="220" height="54" rx="18" fill="#fffdf8"/>
  <text x="86" y="556" fill="#202622" font-family="Avenir Next, Avenir, Arial, sans-serif" font-size="19" font-weight="800">Få gratis mini-tjek</text>
  <text x="910" y="556" fill="#fffdf8" fill-opacity="0.55" font-family="Avenir Next, Avenir, Arial, sans-serif" font-size="18">sitedokai.com/gratis-mini-tjek</text>
</svg>
