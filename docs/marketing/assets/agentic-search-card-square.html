<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SiteDokAI agentic search square card</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: #151a17;
        color: #fffdf8;
        font-family: "Outfit", Avenir, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .card {
        position: relative;
        width: 1080px;
        height: 1080px;
        padding: 68px;
        background:
          radial-gradient(circle at 72% 12%, rgba(143, 166, 143, 0.26), transparent 310px),
          radial-gradient(circle at 12% 88%, rgba(223, 232, 220, 0.13), transparent 300px),
          #151a17;
      }

      .card::before {
        content: "";
        position: absolute;
        inset: 52px;
        border: 1px solid rgba(255, 253, 248, 0.14);
        border-radius: 34px;
      }

      .card::after {
        content: "";
        position: absolute;
        inset: 52px;
        background-image:
          linear-gradient(rgba(255, 253, 248, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 253, 248, 0.06) 1px, transparent 1px);
        background-size: 92px 92px;
        mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.88), transparent 72%);
        border-radius: 34px;
        pointer-events: none;
      }

      .brand {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-weight: 700;
        letter-spacing: -0.02em;
        font-size: 34px;
      }

      .tag {
        border: 1px solid rgba(143, 166, 143, 0.45);
        border-radius: 18px;
        padding: 13px 18px;
        background: rgba(143, 166, 143, 0.12);
        color: #dfe8dc;
        font-size: 18px;
        font-weight: 650;
      }

      h1 {
        position: relative;
        z-index: 1;
        margin: 120px 0 0;
        max-width: 760px;
        color: #fffdf8;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 94px;
        font-weight: 500;
        line-height: 0.96;
        letter-spacing: -0.03em;
      }

      .lead {
        position: relative;
        z-index: 1;
        margin: 34px 0 0;
        max-width: 660px;
        color: rgba(255, 253, 248, 0.66);
        font-size: 29px;
        line-height: 1.28;
      }

      .panel {
        position: absolute;
        right: 88px;
        bottom: 148px;
        z-index: 2;
        width: 396px;
        border: 1px solid rgba(255, 253, 248, 0.15);
        border-radius: 28px;
        background: rgba(32, 38, 34, 0.92);
        box-shadow: 0 32px 90px rgba(0, 0, 0, 0.35);
        padding: 25px;
      }

      .panel-label {
        color: rgba(255, 253, 248, 0.45);
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 13px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 18px 0;
        border-bottom: 1px solid rgba(255, 253, 248, 0.09);
        font-size: 22px;
        color: rgba(255, 253, 248, 0.76);
      }

      .row:last-child {
        border-bottom: 0;
      }

      .ok {
        color: #dfe8dc;
        font-weight: 750;
      }

      .cta {
        position: absolute;
        left: 68px;
        bottom: 70px;
        z-index: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 20px;
        background: #fffdf8;
        color: #202622;
        padding: 19px 25px;
        font-size: 22px;
        font-weight: 760;
      }

      .url {
        position: absolute;
        right: 68px;
        bottom: 76px;
        z-index: 1;
        color: rgba(255, 253, 248, 0.54);
        font-size: 20px;
      }
    </style>
  </head>
  <body>
    <main class="card" aria-label="SiteDokAI agentic search social card">
      <header class="brand">
        <span>SiteDokAI</span>
        <span class="tag">agentic search</span>
      </header>
      <h1>Bliver du valgt af AI-agenten?</h1>
      <p class="lead">Kunder og virksomheder bruger AI til at researche, sammenligne og vælge.</p>

      <section class="panel">
        <p class="panel-label">Agent checks</p>
        <div class="row"><span>Findbarhed</span><span class="ok">klar</span></div>
        <div class="row"><span>Kilder</span><span class="ok">testes</span></div>
        <div class="row"><span>Shortlist</span><span class="ok">måles</span></div>
      </section>

      <div class="cta">Få gratis mini-tjek</div>
      <div class="url">sitedokai.com</div>
    </main>
  </body>
</html>
